name: Release Build

on:
  push:
    tags:
      - "v*"
  # Manual run: builds and uploads artifacts; the release step only runs for tags.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      # ci.yml runs only on claude/** branches, so a release must not rely on it.
      - name: L10n has no duplicate keys
        run: sh scripts/check-l10n.sh

      - name: TestRunner
        run: swift run -c release TestRunner

      - name: InputPipelineTestRunner
        run: swift run -c release InputPipelineTestRunner

      - name: Determine architecture label
        run: |
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            echo "ASSET_ARCH=arm64" >> "$GITHUB_ENV"
          elif [ "$ARCH" = "x86_64" ]; then
            echo "ASSET_ARCH=intel" >> "$GITHUB_ENV"
          else
            echo "Unsupported architecture: $ARCH"
            exit 1
          fi
          echo "Runner architecture: $ARCH"

      - name: Check for Apple certificates
        id: cert_check
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_ID: ${{ secrets.SWITCHFIX_CODESIGN_IDENTITY }}
        run: |
          if [ -n "$P12" ] && [ -n "$PWD" ] && [ -n "$APP_ID" ]; then
             echo "has_certs=true" >> "$GITHUB_OUTPUT"
          else
             echo "has_certs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate (optional)
        if: steps.cert_check.outputs.has_certs == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/switchfix-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/switchfix-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null || \
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning

      - name: Build App
        run: |
          chmod +x scripts/build-app.sh

          # Use named signing identity only when certs were imported.
          # Otherwise force ad-hoc signing to avoid CI failures when only
          # SWITCHFIX_CODESIGN_IDENTITY is configured.
          if [ "${{ steps.cert_check.outputs.has_certs }}" = "true" ]; then
            export SWITCHFIX_CODESIGN_IDENTITY="${{ secrets.SWITCHFIX_CODESIGN_IDENTITY }}"
            echo "Using configured signing identity."
          else
            unset SWITCHFIX_CODESIGN_IDENTITY
            echo "Using ad-hoc signing (no cert secrets configured)."
          fi

          scripts/build-app.sh

      - name: Create DMG
        env:
          SWITCHFIX_DMG_NAME: SwitchFix-${{ env.ASSET_ARCH }}
        run: |
          chmod +x scripts/create-dmg.sh
          scripts/create-dmg.sh

      - name: Zip App Bundle
        run: |
          cd dist
          zip -r "SwitchFix-${ASSET_ARCH}.app.zip" SwitchFix.app
          cd ..

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp "dist/SwitchFix-${ASSET_ARCH}.dmg" release-assets/
          cp "dist/SwitchFix-${ASSET_ARCH}.app.zip" release-assets/
          if [ "$ASSET_ARCH" = "arm64" ]; then
            cp "Resources/Assets.xcassets/AppIcon.svg" "release-assets/AppIcon.svg"
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ env.ASSET_ARCH }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Full history and tags: the notes are built from commits since the previous
      # tag. Checkout runs first because it cleans the workspace it checks out into.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Show collected assets
        run: ls -la release-assets

      # GitHub's generated notes list merged PRs only; most commits land without one
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" "" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.svg
          body_path: ${{ runner.temp }}/release-notes.md
