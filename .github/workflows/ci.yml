name: CI

# One run per pushed code commit: work happens on claude/** branches and reaches
# master through a PR, so pull_request and push-to-master runs would only repeat
# the branch run (a PR whose head is a docs-only commit shows no checks; the run
# is on the last code commit). Releases run the tests again in release.yml.
# Anything else: run manually (workflow_dispatch).
on:
  push:
    branches:
      - "claude/**"
    # Docs-only commits do not start a run. A commit that only updates the task
    # tracker (e.g. recording CI evidence) must not: with cancel-in-progress it
    # would cancel the run of the code commit being recorded.
    paths-ignore:
      - "docs/**"
      - "plan/**"
      - ".claude/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macos-15)
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: L10n has no duplicate keys
        run: sh scripts/check-l10n.sh

      - name: Build (release)
        run: swift build -c release

      - name: TestRunner
        run: swift run -c release TestRunner

      - name: Threshold sweep (report-only)
        shell: bash
        run: |
          set -o pipefail
          swift run -c release TestRunner --threshold-sweep | tee threshold-sweep.txt

      - name: InputPipelineTestRunner
        run: swift run -c release InputPipelineTestRunner

      - name: Build app bundle (ad-hoc signed)
        run: |
          chmod +x scripts/build-app.sh
          unset SWITCHFIX_CODESIGN_IDENTITY
          scripts/build-app.sh
