name: CI

on:
  push:
    branches:
      - master
      - "claude/**"
    # A commit that only updates the task tracker (e.g. recording CI evidence)
    # must not start a run — with cancel-in-progress it would cancel the run of
    # the code commit being recorded.
    paths-ignore:
      - "docs/tasks/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macos-15)
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: L10n has no duplicate keys
        # A repeated key in the dictionary literal crashes the first Russian lookup.
        run: |
          dups=$(grep -oE '^ *"([^"\\]|\\.)*":( |$)' Sources/UI/L10n.swift | sed -E 's/^ *//; s/ $//' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "Duplicate L10n keys:"; echo "$dups"; exit 1; fi

      - name: Build (release)
        run: swift build -c release

      - name: TestRunner
        run: swift run -c release TestRunner

      - name: Threshold sweep (report-only)
        shell: bash
        run: |
          set -o pipefail
          swift run -c release TestRunner --threshold-sweep | tee threshold-sweep.txt

      - name: InputPipelineTestRunner
        run: swift run -c release InputPipelineTestRunner

      - name: Build app bundle (ad-hoc signed)
        run: |
          chmod +x scripts/build-app.sh
          unset SWITCHFIX_CODESIGN_IDENTITY
          scripts/build-app.sh
